<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch { /* Use the system preference. */ }
        document.documentElement.classList.toggle('dark', saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches));
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karthik | Portfolio</title>
    <meta name="description" content="Portfolio of Karthik Korrayi, an IT Professional with 2.6 years of experience in software development, cloud technologies, and IT infrastructure." />
    <meta property="og:title" content="Karthik Korrayi - IT Professional & Software Engineer" />
    <meta property="og:description" content="Portfolio showcasing projects and experience in software development" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>

  </body>
</html>
